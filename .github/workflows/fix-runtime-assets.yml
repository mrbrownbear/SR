name: Fix runtime asset loading

on:
  push:
    branches: [main]
    paths:
      - '.fix/**'
      - '.github/workflows/fix-runtime-assets.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert captured lazy assets to direct local loads
        run: python .fix/fix_lazy_runtime.py
      - name: Verify files exist for page refs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys
          root=Path(".")
          pages=[Path("index.html"),Path("korr-artistic-horizontal-portfolio-carousel/index.html"),Path("filmstrip-hero-3d-image-carousel-collection/index.html")]
          attrs={"src","href","poster","srcset"}
          missing=[]
          external=[]
          class P(HTMLParser):
              def __init__(self,page): super().__init__(convert_charrefs=True); self.page=page
              def handle_starttag(self,tag,aa):
                  for k,v in aa:
                      if not v or k not in attrs: continue
                      vals=[x.strip().split()[0] for x in v.split(",") if x.strip()] if k=="srcset" else [v]
                      for u in vals:
                          if u.startswith(("data:","blob:","about:","#","mailto:","tel:","javascript:")): continue
                          if re.match(r"^(?:https?:)?//",u,re.I):
                              external.append((str(self.page),tag,k,u)); continue
                          if tag=="a": continue
                          q=u.split("#",1)[0].split("?",1)[0]
                          if not q or q=="/": continue
                          f=((root/q.lstrip("/")).resolve()) if q.startswith("/") else ((self.page.parent/q).resolve())
                          if q.endswith("/"): f=f/"index.html"
                          if not f.exists(): missing.append((str(self.page),tag,k,u))
          for p in pages:
              P(p).feed(p.read_text(errors="ignore"))
          print("external refs",len(external))
          print("missing refs",len(missing))
          if external: print(external[:30])
          if missing: print(missing[:30])
          if external or missing: sys.exit(1)
          PY
      - name: Commit repaired site
        run: |
          rm -rf .fix .github/workflows/fix-runtime-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix local asset runtime loading"
          git push origin HEAD:main
