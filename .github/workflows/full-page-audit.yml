name: Full page parity audit
on:
  push:
    branches: [main]
    paths:
      - '.audit/**'
      - '.github/workflows/full-page-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python .audit/full_page_audit.py
