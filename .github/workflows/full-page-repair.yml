name: Full page repair
on:
  push:
    branches: [main]
    paths:
      - '.fix4/**'
      - '.github/workflows/full-page-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install beautifulsoup4 selenium
      - name: Repair full page chrome and exact CSS
        run: python .fix4/full_page_repair.py
      - name: Start static server
        run: |
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Desktop and mobile browser verification
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,time,sys

          routes=["/","/korr-artistic-horizontal-portfolio-carousel/","/filmstrip-hero-3d-image-carousel-collection/"]
          failures=[]
          for width,height,label in [(1440,1200,"desktop"),(390,844,"mobile")]:
            o=Options();o.add_argument("--headless=new");o.add_argument("--no-sandbox");o.add_argument("--disable-dev-shm-usage")
            o.add_argument(f"--window-size={width},{height}")
            o.set_capability("goog:loggingPrefs",{"browser":"ALL","performance":"ALL"})
            d=webdriver.Chrome(options=o);d.set_page_load_timeout(30)
            try:
              for route in routes:
                print("\n===",label,route,"===")
                d.get("http://127.0.0.1:8000"+route);time.sleep(2)
                state=d.execute_script("""
                  const h=document.querySelector('header'),f=document.querySelector('footer'),fb=document.querySelector('#footerbg');
                  const hr=h?.getBoundingClientRect(),fr=f?.getBoundingClientRect(),fbr=fb?.getBoundingClientRect();
                  const logo=h?.querySelector('img');
                  const nav=h?.querySelector('nav, .wp-block-navigation, [class*="menu"]');
                  const mods=window.SR7&&SR7.M?Object.fromEntries(Object.entries(SR7.M).map(([k,v])=>[k,{inited:!!v.states?.inited,h:v.c?.module?.getBoundingClientRect().height||0}])):{};
                  const visibleBroken=[...document.images].filter(i=>{const r=i.getBoundingClientRect(),s=getComputedStyle(i);return r.width>8&&r.height>8&&s.display!=="none"&&s.visibility!=="hidden"&&(!i.complete||i.naturalWidth===0)}).map(i=>i.currentSrc||i.src).slice(0,20);
                  return {
                    title:document.title,
                    bodyH:document.body.scrollHeight,
                    header:{exists:!!h,height:hr?.height||0,display:h?getComputedStyle(h).display:null},
                    footer:{exists:!!f,height:fr?.height||0,display:f?getComputedStyle(f).display:null},
                    footerbg:{exists:!!fb,height:fbr?.height||0,top:(fbr?.top||0)+scrollY,display:fb?getComputedStyle(fb).display:null},
                    logo:{exists:!!logo,w:logo?.naturalWidth||0,h:logo?.naturalHeight||0},
                    nav:{exists:!!nav,display:nav?getComputedStyle(nav).display:null},
                    jquery:!!window.jQuery,
                    sr7:!!window.SR7?.initialised,
                    modules:mods,
                    visibleBroken
                  }
                """)
                print("STATE",json.dumps(state))
                if not state["header"]["exists"] or state["header"]["height"]<40: failures.append(f"{label} {route}: header not rendered")
                if not state["footerbg"]["exists"] or state["footerbg"]["height"]<400: failures.append(f"{label} {route}: footer background/content not rendered")
                if not state["logo"]["exists"] or state["logo"]["w"]<=0: failures.append(f"{label} {route}: header logo broken")
                if not state["jquery"] or not state["sr7"]: failures.append(f"{label} {route}: runtime missing")
                if state["visibleBroken"]: failures.append(f"{label} {route}: visible broken images {state['visibleBroken']}")
                severe=[]
                for e in d.get_log("browser"):
                  if e.get("level")=="SEVERE":
                    msg=e.get("message","")
                    if "Unrecognized Content-Security-Policy directive" not in msg: severe.append(msg)
                print("SEVERE",json.dumps(severe[:30]))
                bad=[x for x in severe if any(y in x for y in ["Uncaught","jQuery is not defined","Failed to load resource","violates the following Content Security Policy"])]
                if bad: failures.extend(f"{label} {route}: {x[:400]}" for x in bad)
            finally:d.quit()
          print("FAILURES",json.dumps(failures,indent=2))
          if failures:sys.exit(1)
          PY
      - name: Commit repaired full pages
        run: |
          rm -rf .fix4 .github/workflows/full-page-repair.yml .audit .github/workflows/full-page-audit.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete header footer and WordPress styling"
          git push origin HEAD:main
