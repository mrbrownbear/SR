name: Hard trim three pages

on:
  push:
    paths:
      - '.github/workflows/hard-trim.yml'
      - 'trim-trigger.txt'

permissions:
  contents: write

jobs:
  trim:
    if: github.event.head_commit.message == 'Run hard trim trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trim page HTML
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('filmstrip-hero-3d-image-carousel-collection/index.html'),
              Path('korr-artistic-horizontal-portfolio-carousel/index.html'),
          ]
          marker = 'h-what-makes-this-slider-revolution-template-a-must-have'
          section_prefix = '<div class="wp-block-group alignwide has-quinary-background-color'

          def remove_element(text, tag):
              low = text.lower()
              a = low.find(f'<{tag}')
              if a < 0:
                  return text
              b = low.find(f'</{tag}>', a)
              if b < 0:
                  raise RuntimeError(f'missing closing {tag}')
              b += len(f'</{tag}>')
              return text[:a] + text[b:]

          for path in files:
              text = path.read_text(encoding='utf-8')
              old_size = len(text)
              text = remove_element(text, 'header')

              m = text.find(marker)
              if m < 0:
                  raise RuntimeError(f'{path}: marker missing')

              a = text.rfind(section_prefix, 0, m)
              if a < 0:
                  raise RuntimeError(f'{path}: target wrapper missing')

              f = text.lower().find('<footer', m)
              if f < 0:
                  raise RuntimeError(f'{path}: footer boundary missing')

              text = text[:a] + '</div>\n' + text[f:]
              text = remove_element(text, 'footer')

              low = text.lower()
              if marker in text or '<header' in low or '<footer' in low or 'instantly captures visitors' in low:
                  raise RuntimeError(f'{path}: unwanted content remains')
              if '<sr7-module' not in low:
                  raise RuntimeError(f'{path}: slider module missing')

              path.write_text(text, encoding='utf-8')
              print(path, old_size, len(text))
          PY

      - name: Verify pages
        shell: bash
        run: |
          set -e
          for f in index.html filmstrip-hero-3d-image-carousel-collection/index.html korr-artistic-horizontal-portfolio-carousel/index.html
          do
            ! grep -q 'h-what-makes-this-slider-revolution-template-a-must-have' "$f"
            ! grep -qi '<header' "$f"
            ! grep -qi '<footer' "$f"
            ! grep -qi 'Instantly captures visitors' "$f"
            grep -qi '<sr7-module' "$f"
          done
          git diff --check

      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html filmstrip-hero-3d-image-carousel-collection/index.html korr-artistic-horizontal-portfolio-carousel/index.html
          git commit -m 'Trim page chrome and lower sections'
          git push origin HEAD:main
