name: Hard trim three pages

on:
  push:
    paths:
      - '.github/workflows/hard-trim.yml'

permissions:
  contents: write

jobs:
  trim:
    if: github.event.head_commit.message == 'Run hard trim across all three pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove header footer and lower sections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          FILES = [
              Path('index.html'),
              Path('filmstrip-hero-3d-image-carousel-collection/index.html'),
              Path('korr-artistic-horizontal-portfolio-carousel/index.html'),
          ]
          MARKER = 'h-what-makes-this-slider-revolution-template-a-must-have'
          TARGET_SECTION = '<div class="wp-block-group alignwide has-quinary-background-color'

          def remove_tag_block(text, tag):
              lower = text.lower()
              start = lower.find(f'<{tag}')
              if start < 0:
                  return text
              end_start = lower.find(f'</{tag}>', start)
              if end_start < 0:
                  raise RuntimeError(f'Closing </{tag}> not found')
              end = end_start + len(f'</{tag}>')
              return text[:start] + text[end:]

          def trim_file(path):
              text = path.read_text(encoding='utf-8')
              original_len = len(text)

              text = remove_tag_block(text, 'header')

              marker = text.find(MARKER)
              if marker < 0:
                  raise RuntimeError(f'{path}: target heading marker not found')

              section_start = text.rfind(TARGET_SECTION, 0, marker)
              if section_start < 0:
                  section_start = text.rfind('<div class="wp-block-group', max(0, marker - 8000), marker)
              if section_start < 0:
                  raise RuntimeError(f'{path}: target section wrapper not found')

              footer_start = text.lower().find('<footer', marker)
              if footer_start < 0:
                  raise RuntimeError(f'{path}: footer boundary not found after target section')

              # Remove the target section and every page section after it.
              # Keep one closing div so the entry-content wrapper remains balanced.
              text = text[:section_start] + '</div>\n' + text[footer_start:]

              text = remove_tag_block(text, 'footer')

              lower = text.lower()
              if MARKER in text:
                  raise RuntimeError(f'{path}: target marker still present')
              if '<header' in lower:
                  raise RuntimeError(f'{path}: header still present')
              if '<footer' in lower:
                  raise RuntimeError(f'{path}: footer still present')
              if 'instantly captures visitors' in lower:
                  raise RuntimeError(f'{path}: target section content still present')
              if '<sr7-module' not in lower:
                  raise RuntimeError(f'{path}: slider module was accidentally removed')

              path.write_text(text, encoding='utf-8')
              print(f'{path}: {original_len} -> {len(text)} bytes')

          for file in FILES:
              trim_file(file)
          PY

      - name: Verify exact removal
        shell: bash
        run: |
          set -e
          for f in \
            index.html \
            filmstrip-hero-3d-image-carousel-collection/index.html \
            korr-artistic-horizontal-portfolio-carousel/index.html
          do
            ! grep -q 'h-what-makes-this-slider-revolution-template-a-must-have' "$f"
            ! grep -qi '<header' "$f"
            ! grep -qi '<footer' "$f"
            ! grep -qi 'Instantly captures visitors' "$f"
            grep -qi '<sr7-module' "$f"
          done
          git diff --check
          git diff --stat

      - name: Commit trimmed pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html filmstrip-hero-3d-image-carousel-collection/index.html korr-artistic-horizontal-portfolio-carousel/index.html
          git commit -m 'Hard trim header footer and lower template sections'
          git push origin HEAD:main
