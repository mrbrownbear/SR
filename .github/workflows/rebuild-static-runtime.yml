name: Rebuild static runtime

on:
  push:
    branches: [main]
    paths:
      - '.fix3/**'
      - '.github/workflows/rebuild-static-runtime.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install beautifulsoup4 selenium

      - name: Reconstruct static runtime
        run: python .fix3/rebuild_runtime.py

      - name: Start static server
        run: |
          python -m http.server 8000 >/tmp/sr-server.log 2>&1 &
          sleep 2

      - name: Verify real browser runtime
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,time,sys

          routes=[
            "/",
            "/korr-artistic-horizontal-portfolio-carousel/",
            "/filmstrip-hero-3d-image-carousel-collection/",
          ]
          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.add_argument("--window-size=1440,1200")
          o.set_capability("goog:loggingPrefs",{"browser":"ALL","performance":"ALL"})
          d=webdriver.Chrome(options=o)
          d.set_page_load_timeout(30)
          failures=[]
          try:
            for route in routes:
              print("\n=== VERIFY",route,"===")
              d.get("http://127.0.0.1:8000"+route)
              ok=False
              state={}
              for _ in range(30):
                time.sleep(0.5)
                state=d.execute_script("""
                  const mods=window.SR7&&SR7.M?Object.fromEntries(Object.entries(SR7.M).map(([k,v])=>[k,{
                    states:v.states||{},
                    slides:v.c&&v.c.module?v.c.module.querySelectorAll('sr7-slide').length:0,
                    rect:v.c&&v.c.module?v.c.module.getBoundingClientRect().toJSON():null
                  }])):{};
                  const visibleBad=[...document.images].filter(i=>{
                    const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
                    return (!i.complete||i.naturalWidth===0)&&r.width>10&&r.height>10&&cs.display!=="none"&&cs.visibility!=="hidden"&&parseFloat(cs.opacity||1)>0;
                  }).map(i=>i.currentSrc||i.src).slice(0,30);
                  return {
                    jquery:!!window.jQuery,
                    sr7:!!window.SR7,
                    initialised:!!window.SR7?.initialised,
                    modules:mods,
                    visibleBad,
                    scripts:[...document.scripts].map(s=>s.src).filter(Boolean),
                    styles:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href),
                    title:document.title
                  };
                """)
                if state.get("jquery") and state.get("initialised"):
                  ok=True
                  break
              print("STATE",json.dumps(state))
              if not state.get("jquery"):
                failures.append(route+": jQuery missing")
              if not state.get("initialised"):
                failures.append(route+": SR7 did not initialise")
              if not state.get("modules"):
                failures.append(route+": no SR7 modules")
              for mid,m in state.get("modules",{}).items():
                r=m.get("rect") or {}
                if r.get("width",0)<=0 or r.get("height",0)<=0:
                  failures.append(route+f": module {mid} has invalid dimensions {r}")
              if state.get("visibleBad"):
                failures.append(route+": visible broken images "+repr(state["visibleBad"][:10]))

              severe=[]
              for entry in d.get_log("browser"):
                if entry.get("level")=="SEVERE":
                  msg=entry.get("message","")
                  if "Unrecognized Content-Security-Policy directive" in msg:
                    continue
                  severe.append(msg)
              print("SEVERE",json.dumps(severe))
              for msg in severe:
                if any(x in msg for x in [
                  "jQuery is not defined","Uncaught","Failed to load script",
                  "Failed to load CSS","violates the following Content Security Policy"
                ]):
                  failures.append(route+": "+msg[:500])

              http_errors=[]
              for entry in d.get_log("performance"):
                try:
                  msg=json.loads(entry["message"])["message"]
                except Exception:
                  continue
                if msg["method"]=="Network.responseReceived":
                  r=msg["params"]["response"]
                  if r.get("status",0)>=400:
                    http_errors.append((r.get("status"),r.get("url")))
              print("HTTP_ERRORS",json.dumps(http_errors[:50]))
              if http_errors:
                failures.append(route+": HTTP errors "+repr(http_errors[:20]))
          finally:
            d.quit()

          print("\nFAILURES",json.dumps(failures,indent=2))
          if failures:
            sys.exit(1)
          PY

      - name: Commit working static site
        run: |
          rm -rf .fix3 .github/workflows/rebuild-static-runtime.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore functional local Slider Revolution runtime"
          git push origin HEAD:main
